services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: complyintel
      POSTGRES_USER: complyintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U complyintel]
      interval: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ['8000:8000']
    environment:
      DATABASE_URL: postgresql+psycopg://complyintel:${POSTGRES_PASSWORD:-local-development-only}@database:5432/complyintel
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a random JWT_SECRET_KEY in .env}
      CORS_ORIGINS: http://localhost:3000
      DEMO_MODE: 'true'
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ['3000:80']
    depends_on: [backend]
volumes:
  postgres-data:
